<svg xmlns="http://www.w3.org/2000/svg" width="260" height="178" viewBox="0 0 260 178">
  <title>Cell state legend</title>
  <rect width="260" height="178" fill="white" stroke="black" stroke-width="1"/>

  <circle cx="22" cy="26" r="9" fill="rgb(220,20,20)" stroke="rgb(120,0,0)" stroke-width="2"/>
  <circle cx="22" cy="26" r="4" fill="rgb(120,0,0)" stroke="rgb(120,0,0)" stroke-width="1"/>
  <text x="40" y="31" font-family="sans-serif" font-size="13">Dying (Apoptosis)</text>

  <circle cx="22" cy="54" r="9" fill="rgb(160,32,240)" stroke="rgb(90,0,140)" stroke-width="2"/>
  <circle cx="22" cy="54" r="4" fill="rgb(90,0,140)" stroke="rgb(90,0,140)" stroke-width="1"/>
  <text x="40" y="59" font-family="sans-serif" font-size="13">Senescent</text>

  <circle cx="22" cy="82" r="9" fill="rgb(255,140,0)" stroke="rgb(160,80,0)" stroke-width="2"/>
  <circle cx="22" cy="82" r="4" fill="rgb(160,80,0)" stroke="rgb(160,80,0)" stroke-width="1"/>
  <text x="40" y="87" font-family="sans-serif" font-size="13">Autophagic</text>

  <circle cx="22" cy="110" r="9" fill="rgb(0,180,0)" stroke="rgb(0,90,0)" stroke-width="2"/>
  <circle cx="22" cy="110" r="4" fill="rgb(0,90,0)" stroke="rgb(0,90,0)" stroke-width="1"/>
  <text x="40" y="115" font-family="sans-serif" font-size="13">Proliferating</text>

  <circle cx="22" cy="138" r="9" fill="rgb(170,170,170)" stroke="rgb(90,90,90)" stroke-width="2"/>
  <circle cx="22" cy="138" r="4" fill="rgb(90,90,90)" stroke="rgb(90,90,90)" stroke-width="1"/>
  <text x="40" y="143" font-family="sans-serif" font-size="13">Other / quiescent</text>

  <!-- No extra text/caption elements below this point: Studio's legend parser
       (vis_base.py get_cell_types_from_legend) treats every text element as a
       state name and zips it 1 to 1 against every other circle's fill color;
       an extra text element here would silently break that pairing. -->
</svg>
